<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - Login'">Payment Platform Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-login { width: 420px; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; border-top-left-radius: 12px !important; border-top-right-radius: 12px !important; padding: 25px; text-align: center; }
    </style>
</head>
<body>
<div class="card card-login">
    <div class="card-header">
        <h3 class="mb-1" th:text="${appName}">GlobalPay Platform</h3>
        <small class="text-white-50">International Payment Gateway Console</small>
    </div>
    <div class="card-body p-4">
        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
            Invalid credentials or account locked.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
            Logged out successfully.
        </div>
        <div class="mb-3 text-center">
            <span class="badge bg-secondary" th:text="'Auth Mode: ' + ${authMode}">Auth Mode: DB</span>
        </div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="admin / maker / checker" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold">Sign In</button>
        </form>
        <div class="mt-4 text-center text-muted" style="font-size: 0.85rem;">
            Default Accounts: <strong>admin</strong>, <strong>maker</strong>, <strong>checker</strong> (Password = Username)
        </div>
    </div>
</div>
</body>
</html>
